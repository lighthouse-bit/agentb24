</td></tr>`}).join('');const t=sub*(+tax.value||0)/100;vSub.textContent=currency.value+sub.toFixed(2);vTax.textContent=currency.value+t.toFixed(2);vTotal.textContent=currency.value+(sub+t).toFixed(2)}[business,number,client,from,currency,tax].forEach(x=>x.oninput=update);add.onclick=()=>{rows.push({d:'',q:1,p:0});renderInputs();update()};renderInputs();update()</script><script src="../assets/js/tracker.js?v=20261121-analytics2"></script><script src="../assets/js/ads.js?v=20261120-popunder"></script>
