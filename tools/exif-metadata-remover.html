</head><body><header></header><main class="suite-wrap"><div class="suite-head"><div class="breadcrumb"><a href="image-tools.html">Image Tools</a> › EXIF Cleaner</div><h1>EXIF Metadata Viewer & Remover</h1><p>Inspect hidden photo information and export a clean copy before sharing it.</p></div><section class="suite-card"><h2>Choose a photo</h2><div class="suite-field"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="suite-actions"><button id="clean" class="btn btn-primary" disabled>Remove metadata & download</button></div><div id="suite-status" class="suite-status"></div></section><section class="suite-card"><h2>Detected information</h2><div id="meta" class="meta-grid"><p class="muted">Photo information will appear here.</p></div></section><section class="suite-card"><h2>Preview</h2><div class="suite-preview"><img id="preview" alt=""></div></section></main><footer></footer><script src="../assets/js/main.js"></script><script>window.toolPageConfig={category:'Image Tools',hub:'image-tools.html',icon:'🕵️',steps:['Choose a photo|Load a JPG, PNG, or WebP image from your device.','Review its information|See file details and common EXIF camera and date fields when available.','Export a clean copy|Re-encode the image to remove embedded metadata.'],faqs:['What can EXIF reveal?|Photos may contain camera details, timestamps, software names, and sometimes GPS coordinates.','Does cleaning change the picture?|The image is re-encoded at high quality, so a small size or quality change is possible.','Is the photo uploaded?|No. Inspection and cleaning happen locally.'],related:[['Background Remover','image-background-remover.html'],['Image Compressor','image-compressor.html'],['Format Converter','image-format-converter.html']]}</script><script src="../assets/js/tool-suite.js"></script><script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script><script>let img=new Image(),loaded;file.onchange=async()=>{const f=file.files[0];if(!f)return;loaded=f;img.src=preview.src=URL.createObjectURL(f);clean.disabled=false;let info={Name:f.name,Type:f.type||'Unknown',Size:formatBytes(f.size),'Last modified':new Date(f.lastModified).toLocaleString()};try{const e=await exifr.parse(f,{tiff:true,exif:true,gps:true,ifd0:true});if(e)for(const [k,v] of Object.entries(e))if(['string','number','boolean'].includes(typeof v)||v instanceof Date)info[k]=v instanceof Date?v.toLocaleString():String(v)}catch(e){}meta.innerHTML=Object.entries(info).map(([k,v])=>`<div class="meta-item"><b>${k}</b><span>${v}</span></div>`).join('');suiteStatus('Metadata inspected.')} ;clean.onclick=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);const type=loaded.type==='image/png'?'image/png':'image/jpeg';c.toBlob(b=>{downloadBlob(b,loaded.name.replace(/\.[^.]+$/,'')+'-clean.'+(type==='image/png'?'png':'jpg'));suiteStatus('Clean image downloaded.')},type,.94)}</script><script src="../assets/js/tracker.js?v=20261121-analytics2"></script><script src="../assets/js/ads.js?v=20261120-popunder"></script>
